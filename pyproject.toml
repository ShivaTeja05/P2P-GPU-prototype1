[project]
name = "p2pgpu"
version = "1.0.0"
description = "Share one GPU between two computers over an encrypted overlay network"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "psutil>=6.1",
]

[project.optional-dependencies]
# Installed on GPU worker nodes only. On the Mac control node you can skip this.
torch = ["torch>=2.5"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
p2pgpu = "p2pgpu.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p2pgpu"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Typer's whole API is `def cmd(x: int = typer.Option(...))`. B008 fires on every
# command in the CLI and there is no way to write Typer without it.
ignore = ["B008"]
